[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackboard-integration-toolkit"
version = "1.0.0"
description = "Enterprise integration toolkit for Blackboard Learn"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Awais Ali", email = "awaisali3405@gmail.com"}
]
maintainers = [
    {name = "Awais Ali", email = "awaisali3405@gmail.com"}
]
keywords = ["blackboard", "lms", "integration", "sis", "erp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
    "structlog>=24.1.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.0.0",
    "flask>=3.0.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/awais69735/blackboard-integration-toolkit"
Documentation = "https://awais69735.github.io/blackboard-integration-toolkit/"
Repository = "https://github.com/awais69735/blackboard-integration-toolkit"
Issues = "https://github.com/awais69735/blackboard-integration-toolkit/issues"
Changelog = "https://github.com/awais69735/blackboard-integration-toolkit/blob/main/CHANGELOG.md"

[project.scripts]
bb-toolkit = "blackboard.interfaces.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["blackboard*"]

[tool.ruff]
target-version = "py310"
line-length = 88
select = ["E", "F", "I", "N", "W", "D", "UP", "B", "C4", "SIM"]
ignore = ["D203", "D213"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=blackboard --cov-report=term-missing"